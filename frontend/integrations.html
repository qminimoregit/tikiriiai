<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Integrations · TIKIRII</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+Sinhala:wght@400;500;600&family=Noto+Sans+Tamil:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<main>
  <div class="page-head">
    <div>
      <h1>Integrations</h1>
      <p class="subtitle">Systems TIKIRII connects to. The agent mentions them when callers ask how it fits with what they already use.</p>
    </div>
    <button type="button" class="primary" id="add-btn">Add integration</button>
  </div>
  <div class="card"><div id="list"></div></div>
</main>

<dialog id="item-dialog">
  <form id="item-form" method="dialog">
    <h2 id="dialog-title">Add integration</h2>
    <div class="field"><label for="f-name">Name</label><input type="text" id="f-name" name="name" maxlength="200" required /></div>
    <div class="field"><label for="f-desc">What it does</label><textarea id="f-desc" name="description" rows="3"></textarea></div>
    <div class="field"><label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" name="is_active" /> Tell callers about it</label></div>
    <div class="actions">
      <button type="button" id="cancel-btn">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<script src="js/api.js"></script>
<script src="js/catalog.js"></script>
<script>
  catalogPage({
    endpoint: "/api/integrations",
    singular: "integration",
    empty: "No integrations yet.",
    defaults: { is_active: true },
    render: (i) => [el("strong", {}, i.name), el("div", { class: "sub" }, i.description)],
  });
</script>
</body>
</html>
