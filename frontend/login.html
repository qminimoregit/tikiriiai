<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · TIKIRII</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { align-items: center; justify-content: center; padding: 24px 16px; }
    .login { width: 100%; max-width: 400px; }
    .login .brand { padding: 0 0 22px; justify-content: center; font-size: 20px; }
    .login .card { padding: 30px 30px 32px; }
    .login h1 { font-size: 23px; margin-bottom: 4px; }
    .login button { width: 100%; height: 44px; margin-top: 24px; }
    .error { color: var(--danger); background: var(--danger-soft); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 15px; margin-top: 18px; }
  </style>
</head>
<body>
  <div class="login">
    <div class="brand"><span class="brand-mark">T</span>TIKIRII</div>
    <div class="card">
      <h1>Sign in</h1>
      <p class="section-note">Admin panel for your AI phone receptionist.</p>
      <form id="login-form">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required autofocus />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
        </div>
        <div class="error" id="error" hidden></div>
        <button type="submit" class="primary">Sign in</button>
      </form>
    </div>
  </div>
  <script>
    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("error");
    // Only allow same-site paths as the post-login destination.
    const next = new URLSearchParams(location.search).get("next") || "/";
    const dest = next.startsWith("/") && !next.startsWith("//") && !next.startsWith("/login") ? next : "/";

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.hidden = true;
      const button = form.querySelector("button");
      button.disabled = true;
      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: form.username.value, password: form.password.value }),
        });
        if (res.ok) return location.replace(dest);
        const data = await res.json().catch(() => ({}));
        errorEl.textContent = data.detail || "Could not sign in";
        errorEl.hidden = false;
        form.password.value = "";
        form.password.focus();
      } catch {
        errorEl.textContent = "Could not reach the server";
        errorEl.hidden = false;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
