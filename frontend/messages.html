<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Messages sent · TIKIRII</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+Sinhala:wght@400;500;600&family=Noto+Sans+Tamil:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<main>
  <div class="page-head">
    <div>
      <h1>Messages sent</h1>
      <p class="subtitle">The details the agent sent to callers by SMS or WhatsApp, exactly as the caller received them. "Not sent" means a provider is not set up yet or the number could not be messaged.</p>
    </div>
    <select id="status" style="width:auto">
      <option value="">All</option><option value="sent">Sent</option><option value="delivered">Delivered</option>
      <option value="failed">Failed</option><option value="not_sent">Not sent</option>
    </select>
  </div>
  <div class="card">
    <div class="table-wrap">
      <table>
        <thead><tr><th>When</th><th>Channel</th><th>To</th><th>Language</th><th>Message</th><th>Status</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="pager">
      <span class="hint" id="page-info"></span>
      <button type="button" class="small" id="prev">← Newer</button>
      <button type="button" class="small" id="next">Older →</button>
    </div>
  </div>
</main>
<script src="js/api.js"></script>
<script>
  let page = 1;
  async function load() {
    await appReady;
    const status = document.getElementById("status").value;
    const data = await api(`/api/messages?page=${page}${status ? `&status=${status}` : ""}`);
    clear(document.getElementById("rows"), data.items.length
      ? data.items.map((m) => el("tr", {},
          el("td", {}, fmtDT(m.created_at)),
          el("td", {}, CHANNEL_NAMES[m.channel] || m.channel),
          el("td", {}, m.phone, m.call_id ? el("div", { class: "hint" }, el("a", { href: `call.html?id=${m.call_id}` }, `call #${m.call_id}`)) : null),
          el("td", {}, LANG_LABELS[m.language] || "—"),
          el("td", { style: "white-space:pre-wrap;max-width:420px" }, m.text),
          el("td", {}, badge(m.status), m.error ? el("div", { class: "hint" }, m.error) : null),
          el("td", {}, el("button", { type: "button", class: "small danger", onclick: () => remove(m) }, "Delete"))))
      : el("tr", {}, el("td", { colspan: 7, class: "empty" }, "Nothing sent yet.")));
    const pages = Math.max(1, Math.ceil(data.total / data.page_size));
    document.getElementById("page-info").textContent = `${data.total} message${data.total === 1 ? "" : "s"} · page ${page} of ${pages}`;
    document.getElementById("prev").disabled = page <= 1;
    document.getElementById("next").disabled = page >= pages;
  }
  async function remove(m) {
    if (!(await confirmAction("Delete this record?"))) return;
    await api(`/api/messages/${m.id}`, { method: "DELETE" });
    load().catch((e) => toast(e.message, true));
  }
  document.getElementById("status").addEventListener("change", () => { page = 1; load().catch((e) => toast(e.message, true)); });
  document.getElementById("prev").addEventListener("click", () => { page--; load().catch((e) => toast(e.message, true)); });
  document.getElementById("next").addEventListener("click", () => { page++; load().catch((e) => toast(e.message, true)); });
  load().catch((e) => toast(e.message, true));
</script>
</body>
</html>
