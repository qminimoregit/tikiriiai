; Dialplan for tikiriiai. Route the TIKIRII line's number (DID) here: tikirii,s,1
;
; The caller hears the language menu recording and picks 1 (Sinhala), 2 (Tamil) or 3 (English). The agent then speaks
; only that language. The menu is played by the dialplan with Read() because many PBXes do not pass key presses to
; AudioSocket (Asterisk 22.4+ does; if yours does, drop the Read() lines and the menu=1&lang= part, and the app plays
; the menu itself). The app keeps lang-menu.wav (8 kHz) in ASTERISK_SOUNDS_DIR in step with the admin upload:
; set ASTERISK_SOUNDS_DIR=/var/lib/asterisk/sounds/tikiriiai and the dialplan plays tikiriiai/lang-menu.
;
; PBX_ALLOWED_IPS and PBX_HOOK_TOKEN in .env must match the CURL line. AudioSocket port = PBX_AUDIOSOCKET_PORT (9094).
[tikirii]
exten => s,1,Answer()
 same => n(start),Set(TRIES=0)
 same => n(menu),Read(DIGIT,tikiriiai/lang-menu,1,,1,5)
 same => n,Set(IVR_LANG=${IF($["${DIGIT}"="1"]?si:${IF($["${DIGIT}"="2"]?ta:${IF($["${DIGIT}"="3"]?en:)})})})
 same => n,GotoIf($["${IVR_LANG}"!=""]?go)
 same => n,Set(TRIES=$[${TRIES}+1])
 same => n,GotoIf($[${TRIES}<2]?menu)
 same => n(go),Set(CALL_UUID=${UUID()})
 same => n,Set(R=${CURL(http://127.0.0.1:8000/api/pbx/call-start?uuid=${CALL_UUID}&menu=1&lang=${IVR_LANG}&caller=${URIENCODE(${CALLERID(num)})}&pai=${URIENCODE(${PJSIP_HEADER(read,P-Asserted-Identity)})}&name=${URIENCODE(${CALLERID(name)})}&chan=${URIENCODE(${CHANNEL})}&ctx=${CONTEXT}&exten=${EXTEN}&token=YOUR_PBX_HOOK_TOKEN)})
 same => n,AudioSocket(${CALL_UUID},127.0.0.1:9094)
 same => n,Hangup()

; Pressing # during the conversation returns the caller to `start` (the language menu): the app listens for it on the
; Asterisk manager (AMI), so create an AMI user for 127.0.0.1 with read=dtmf and write=call and set AMI_USER and AMI_SECRET.
