#
# Every language file has exactly the same keys. The app checks them at startup and refuses to start, naming the
# file and the key, if one is missing or misspelt. Placeholders in {braces} are filled in by the app.
#
# Have a native speaker review this file: the agent speaks the way it is told to here.

