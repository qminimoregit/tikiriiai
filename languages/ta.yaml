common: {ask_phone: 'உங்கள் கைத்தொலைபேசி இலக்கத்தைச் சொல்ல முடியுமா?', read_back_phone: 'நீங்கள் சொன்ன இலக்கம் {phone}. சரியா?', phone_ten_digits: 'மன்னிக்கவும், தொலைபேசி இலக்கத்தில் பத்து இலக்கங்கள் இருக்க வேண்டும். பூஜ்ஜியத்தில் தொடங்கி முழு இலக்கத்தையும் மெதுவாகச் சொல்லுங்கள்.', ask_new_phone: நீங்கள் விரும்பும் தொலைபேசி இலக்கத்தைச் சொல்லுங்கள்., which_detail_wrong: 'மன்னிக்கவும். எந்த விவரம் தவறு?', please_repeat: 'மன்னிக்கவும், எனக்குத் தெளிவாகக் கேட்கவில்லை. மீண்டும் சொல்ல முடியுமா?', sorry_wrong: 'மன்னிக்கவும், நான் தவறாகச் சொன்னேன்.', anything_else: 'TIKIRII பற்றி வேறு ஏதாவது தெரிந்துகொள்ள விரும்புகிறீர்களா?', no_information: 'மன்னிக்கவும், அந்தத் தகவல் இப்போது என்னிடம் இல்லை. demo இல் எங்கள் குழு அதைப் பற்றிச் சொல்லும்.', out_of_scope: 'மன்னிக்கவும், {company} பற்றிய கேள்விகளுக்கு மட்டுமே என்னால் உதவ முடியும்.', other_language: 'மன்னிக்கவும், இந்த அழைப்பில் என்னால் தமிழில் மட்டுமே பேச முடியும். வேறு மொழி வேண்டுமென்றால், hash விசையை அழுத்தி பிரதான மெனுவுக்குச் சென்று மொழியைத் தேர்ந்தெடுங்கள்.', still_there: 'நீங்கள் இன்னும் இருக்கிறீர்களா?', no_response: 'பதில் கிடைக்காததால் அழைப்பை முடிக்கிறேன். அழைத்ததற்கு நன்றி. இனிய நாள்!', wrap_up: 'அழைப்பின் நேரம் முடிவடையப் போகிறது. வேறு ஏதாவது வேண்டுமென்றால் இப்போதே சொல்லுங்கள்.', goodbye: 'TIKIRII இற்கு அழைத்ததற்கு நன்றி. இனிய நாள்!'}
send: {offer: 'TIKIRII பற்றிய சுருக்கமான விவரத்தை உங்கள் தொலைபேசிக்குச் செய்தியாக அனுப்பவா?', ask_mobile: 'அனுப்ப வேண்டிய கைத்தொலைபேசி இலக்கத்தைச் சொல்ல முடியுமா?', use_caller_id: 'நீங்கள் அழைக்கும் {phone} இலக்கத்திற்கே அனுப்பவா?', not_mobile: 'மன்னிக்கவும், அது கைத்தொலைபேசி இலக்கம் அல்ல. ஒரு கைத்தொலைபேசி இலக்கத்தைச் சொல்ல முடியுமா?', sent: 'சரி, விவரங்களை உங்கள் தொலைபேசிக்கு அனுப்பிவிட்டேன். சிறிது நேரத்தில் வந்துவிடும்.', not_set_up: 'மன்னிக்கவும், இப்போது செய்திகளை அனுப்ப முடியவில்லை. விவரங்களை நான் இப்போது சொல்கிறேன்.', nothing_to_send: 'மன்னிக்கவும், அதைப் பற்றி அனுப்பக்கூடிய விவரங்கள் என்னிடம் இல்லை.'}
lead: {offer: 'TIKIRII உங்கள் வணிகத்திற்கு எப்படி வேலை செய்யும் என்று காட்ட, எங்கள் குழுவுடன் இலவச demo ஒன்றை book செய்யவா?', ask_name: 'உங்கள் பெயரைச் சொல்ல முடியுமா?', ask_business: 'உங்கள் வணிகத்தின் பெயர் என்ன?', ask_time: 'demo பற்றி எங்கள் குழு உங்களை அழைக்க எந்த நேரம் வசதியானது?', use_caller_id: 'நீங்கள் இப்போது அழைக்கும் {phone} இலக்கத்திலேயே எங்கள் குழு உங்களை அழைக்கலாமா?', booked: 'நன்றி. உங்கள் demo கோரிக்கையை book செய்துவிட்டேன். எங்கள் குழு விரைவில் உங்களை அழைத்து அதை ஏற்பாடு செய்யும்.', confirm_details: 'விவரங்களை ஒருமுறை சரிபார்க்கிறேன். உங்கள் பெயர் {name}, உங்கள் வணிகம் {business}, எங்கள் குழு உங்களை {time} {phone} இலக்கத்தில் அழைக்கும். சரியா?', booked_sms: 'நன்றி. உங்கள் demo கோரிக்கையை book செய்து, உறுதிப்படுத்தும் செய்தியை உங்கள் தொலைபேசிக்கு அனுப்பியுள்ளேன். எங்கள் குழு விரைவில் உங்களை அழைத்து அதை ஏற்பாடு செய்யும்.', updated: 'நன்றி. உங்கள் demo கோரிக்கையைப் புதுப்பித்துவிட்டேன். எங்கள் குழு விரைவில் உங்களை அழைத்து அதை ஏற்பாடு செய்யும்.', updated_sms: 'நன்றி. உங்கள் demo கோரிக்கையைப் புதுப்பித்து, திருத்திய விவரங்களை உங்கள் தொலைபேசிக்கு அனுப்பியுள்ளேன்.', already_booked: 'உங்கள் demo கோரிக்கை ஏற்கனவே book செய்யப்பட்டுள்ளது. எங்கள் குழு விரைவில் உங்களை அழைக்கும்.'}
